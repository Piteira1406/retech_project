<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    
    <!-- fontes do google -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="/static/css/Utilizador.css"  rel="stylesheet">
    <link href="/nav_footer.css"  rel="stylesheet">
    <script src="https://kit.fontawesome.com/8675213cad.js" crossorigin="anonymous"></script>
    <!--css do menu e do footer-->
    
    <!--Site ficar responsivo-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <!--favicon-->
    <link rel="icon" type="image/x-icon" href="/public/favicon.ico.png">

          <main class="main">
        <section id="Info">
            <h2>{{ username }}</h2>
            <form class="info">
                <label for="name">Nome:</label>
                <input type="text" id="name" name="name"><br><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email"><br><br>
                
                <label for="password">Senha:</label>
                <input type="password" id="password" name="password"><br><br>

                <label for="password">Confirmar Senha:</label>
                <input type="password" id="password" name="password"><br><br>
                
                <button type="submit">Salvar Alterações</button>
                
            </form>
        </section>

        <section id="Histórico">
            <h2>Histórico de Pedidos</h2>
            <table class="history">
                <thead>
                    <tr>
                        <th>Pedido</th>
                        <th>Data</th>
                        <th>Status</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>#12345</td>
                        <td>01/01/2023</td>
                        <td>Entregue</td>
                        <td>100,00€</td>
                    </tr>
                    <tr>
                        <td>#12346</td>
                        <td>02/01/2023</td>
                        <td>Processando</td>
                        <td>150,00€</td>
                    </tr>
                </tbody>
            </table>
        </section>
          </main>
        </body>
        </html>

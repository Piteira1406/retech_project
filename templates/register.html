{% extends "partials/base.html" %}

{% block title %}Registo | ReTech{% endblock %}
{% block wrapper %}
    {% include 'partials/header.html' %}
        <body>
            <main class="main">
                <section class="info">
                    <h2>Criar Conta</h2>
                    <form action="/register" method="POST" >
                        <input type="text" id="username" name="username" placeholder="Nome" required>
                        <input type="email" id="email" name="email" placeholder="E-mail" required>
                        <input type="password" id="password" name="password" placeholder="Password" required>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirmar Password" required>
                        <button type="submit">Salvar Alterações</button>
                    </form>
                </section>
            </main>
        </body>
{% endblock %}
